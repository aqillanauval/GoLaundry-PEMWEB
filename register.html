<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - GoLaundry</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="login-box">
    <h2>Buat Akun Baru</h2>
    <p class="subtitle">Daftar untuk mulai menggunakan layanan laundry.</p>

    <form id="registerForm">
      <input type="text" id="nama" placeholder="Nama Lengkap" required>
      <input type="text" id="username" placeholder="Email atau No. HP" required>
      <input type="password" id="password" placeholder="Password" required>
      <input type="password" id="confirmPassword" placeholder="Ulangi Password" required>
      <select id="role" required>
        <option value="customer">Daftar sebagai Customer</option>
        <option value="admin">Daftar sebagai Admin/Staff</option>
      </select>
      <p id="registerError" class="error-text"></p>
      <button type="submit" class="btn-primary">Daftar</button>
    </form>

    <p class="register-text">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
  </div>

  <script src="register.js"></script>
</body>
</html>

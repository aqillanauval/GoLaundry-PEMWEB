<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Pelanggan - GoLaundry</title>
  <link rel="stylesheet" href="pelanggan.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="sidebar">
      <h2 class="logo">GoLaundry</h2>
      <nav>
        <a href="dashboard-admin.html">Dashboard</a>
        <a href="layanan.html">Manajemen Layanan</a>
        <a href="pelanggan.html" class="active">Manajemen Pelanggan</a>
        <a href="transaksi.html">Riwayat Transaksi</a>
        <a href="karyawan.html">Manajemen Karyawan</a>
        <a href="profile.html">Profil</a>
        <a href="login.php?logout=1">Keluar</a>
      </nav>
    </aside>

    <main class="content">
      <button id="menuToggle" class="menu-toggle">&#9776;</button>

      <h1>Manajemen Pelanggan</h1>
      <p class="subtitle">Kelola akun pelanggan yang terdaftar di GoLaundry.</p>

      <section class="card">
        <form id="pelangganForm">
          <input type="hidden" id="usernameLama" value="">
          <input type="text" id="nama" placeholder="Nama Lengkap" required>
          <input type="text" id="username" placeholder="Email atau No. HP" required>
          <input type="password" id="password" placeholder="Password" required>
          <p id="pelangganError" class="error-text"></p>
          <button type="submit" class="btn-primary" id="submitBtn">Tambah Pelanggan</button>
          <a href="#" class="see-all" id="batalEdit" style="display:none;">Batal edit</a>
        </form>
      </section>

      <section class="card">
        <h3>Daftar Pelanggan</h3>
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Username</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="pelangganBody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="pelanggan.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Layanan - GoLaundry</title>
  <link rel="stylesheet" href="layanan.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="sidebar">
      <h2 class="logo">GoLaundry</h2>
      <nav>
        <a href="dashboard-admin.html">Dashboard</a>
        <a href="layanan.html" class="active">Manajemen Layanan</a>
        <a href="pelanggan.html">Manajemen Pelanggan</a>
        <a href="karyawan.html">Manajemen Karyawan</a>
        <a href="transaksi.html">Riwayat Transaksi</a>
        <a href="profile.html">Profil</a>
        <a href="login.php?logout=1">Keluar</a>
      </nav>
    </aside>

    <main class="content">
      <button id="menuToggle" class="menu-toggle">&#9776;</button>

      <h1>Manajemen Layanan</h1>
      <p class="subtitle">Kelola daftar layanan laundry beserta harganya. Ini yang muncul di form pesanan customer.</p>

      <section class="card">
        <form id="layananForm">
          <input type="hidden" id="layananId" value="">
          <input type="text" id="nama" placeholder="Nama Layanan" required>
          <input type="number" id="harga" placeholder="Harga" min="1" required>
          <input type="text" id="satuan" placeholder="Satuan (kg/item)" required>
          <p id="layananError" class="error-text"></p>
          <button type="submit" class="btn-primary" id="submitBtn">Tambah Layanan</button>
          <a href="#" class="see-all" id="batalEdit" style="display:none;">Batal edit</a>
        </form>
      </section>

      <section class="card">
        <h3>Daftar Layanan</h3>
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Harga</th>
              <th>Satuan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="layananBody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="layanan.js"></script>
</body>
</html>
